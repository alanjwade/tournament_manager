name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build application
        run: npm run build
      
      - name: Package for Windows
        run: npm run package:win
      
      - name: List release files
        run: dir release
        shell: cmd
      
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: warn
      
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            WINDOWS_RELEASE_README.md
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 📦 Download and Install
            
            **For Windows Users:**
            1. Download `TournamentManager-Setup-*.exe`
            2. Run the installer and follow the prompts
            3. Launch TournamentManager from your Start Menu or Desktop shortcut
            
            📖 See `WINDOWS_RELEASE_README.md` for complete instructions.
            
            ## 💾 Tournament Data
            
            Your tournament data saves automatically to your user AppData folder.
            Data persists across updates and can be exported/imported as needed.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep only the 10 latest releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # List releases newest-first, ignore drafts, and delete everything
          # beyond the 10 most recent. Git tags are preserved so nothing is lost.
          gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName' \
            | tail -n +11 \
            | while IFS= read -r tag; do
                echo "Deleting old release: $tag"
                gh release delete "$tag" --yes --cleanup-tag=false || true
              done
